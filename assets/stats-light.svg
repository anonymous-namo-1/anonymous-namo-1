<svg xmlns="http://www.w3.org/2000/svg" width="490" height="240" viewBox="0 0 490 240"><defs><filter id="glow"><feGaussianBlur stdDeviation=".4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect fill-opacity="1" width="4" height="2" fill="#f5f0e1" opacity=".5"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#f5f0e1" stop-opacity="0"/><stop offset="100%" stop-color="#f5f0e1" stop-opacity=".7"/></radialGradient></defs>
<style>text{font-family:'Courier New',Consolas,monospace;fill:#14532d} .dim{fill:#a16207} .flick{animation:fl 4s infinite} @keyframes fl{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.8}}
.sweep{animation:sw 6s linear infinite} @keyframes sw{from{transform:translateY(-40px)}to{transform:translateY(400px)}}</style>
<rect width="490" height="240" rx="10" fill="#f5f0e1" stroke="#14532d" stroke-opacity=".6"/>
