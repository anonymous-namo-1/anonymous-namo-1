<svg xmlns="http://www.w3.org/2000/svg" width="390" height="125" viewBox="0 0 390 125"><defs><filter id="glow"><feGaussianBlur stdDeviation=".4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect fill-opacity="1" width="4" height="2" fill="#f5f0e1" opacity=".5"/></pattern>
<radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#f5f0e1" stop-opacity="0"/><stop offset="100%" stop-color="#f5f0e1" stop-opacity=".7"/></radialGradient></defs>
<style>text{font-family:'Courier New',Consolas,monospace;fill:#14532d} .dim{fill:#a16207} .flick{animation:fl 4s infinite} @keyframes fl{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.8}}
.sweep{animation:sw 6s linear infinite} @keyframes sw{from{transform:translateY(-40px)}to{transform:translateY(400px)}}</style>
<rect width="390" height="125" rx="10" fill="#f5f0e1" stroke="#14532d" stroke-opacity=".6"/>
<g class="flick" filter="url(#glow)"><text x="18" y="28" font-size="14" font-weight="bold">FILE #005 :: neon-deceit-game</text>
<line x1="18" y1="38" x2="372" y2="38" stroke="#14532d" stroke-opacity=".4"/><text x="22" y="62" font-size="11" class="dim">CLASSIFICATION: SOCIAL DEDUCTION</text><text x="22" y="84" font-size="13">Neon deception game</text><text x="22" y="108" font-size="11" class="dim">LANG: TypeScript  ★ 0  STATUS: ACTIVE</text><rect x="300" y="50" width="70" height="20" fill="none" stroke="#14532d"><animate attributeName="opacity" values="1;.2;1" dur="2s" begin="1.2s" repeatCount="indefinite"/></rect><text x="335" y="64" font-size="10" text-anchor="middle">ACCESS</text></g>
<rect class="sweep" width="390" height="30" fill="#14532d" opacity=".05"/>
<rect width="390" height="125" rx="10" fill="url(#scan)"/><rect width="390" height="125" rx="10" fill="url(#vig)"/></svg>